# Years of total relevant experience (used in fit scoring).
experience_years: 4

# Path to the SQLite database file, relative to the repo root.
# Will be replaced by a DATABASE_URL env var when migrating to Postgres.
db_path: "edgedash.db"

# Listings with a fit score below this threshold are excluded from the
# dashboard default view.
min_fit_score: 50

# Enabled job sources (must match keys in the SOURCES registry).
# Add more source names here when new sources are implemented.
sources:
  - "arbeitnow"

# Set to true to use MockFetcher instead of the real Fetcher.
# Useful for offline development and testing without hitting any network.
use_mock_fetcher: false

# LLM provider and model for scoring. Changing the model requires only a
# config change — no code change needed.
llm_provider: "openrouter"
llm_model: "liquid/lfm-2.5-2.6b:free"

# Fallback models tried in order when the primary fails with 402/429/5xx.
# All listed here are free-tier on OpenRouter — no credits needed.
# To use Nemotron Ultra for production scoring, set llm_model to
# "nvidia/nemotron-3-ultra-550b-a55b" (no :free suffix) once you have credits.
llm_model_fallbacks:
  - "minimax/minimax-m3:free"
  - "openrouter/free"

# Maximum number of listings scored per cycle. Caps cost and rate-limit
# exposure — do not remove this guard.
score_batch_size: 25
