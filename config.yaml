# EdgeDash user configuration
# Copy this file, rename it config.yaml, and edit to match your profile.
# No value here is secret — keep secrets in environment variables only.

# The role title you are targeting (used in search queries and scoring).
target_role: "Data Engineer"

# City / metro area for job searches.
target_city: "Hyderabad"

# Additional keywords injected into search queries.
# Kept broad enough to discover relevant Data Engineering roles.
keywords:
  - "Data Engineer"
  - "Senior Data Engineer"
  - "Cloud Data Engineer"
  - "Data Platform"
  - "Data Engineering"
